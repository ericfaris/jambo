name: CI/CD

# jambo2 is self-hosted on the local Docker lab (built with
# `docker compose up -d --build` on the host and exposed via Cloudflare
# Tunnel at https://jambo.mooseflip.com). There is no registry push or
# remote deploy — this workflow verifies the app builds/tests and that the
# Docker image still builds, so breakage is caught before merge.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build_test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: |
          npm ci
          npm install --no-save @rollup/rollup-linux-x64-gnu@4.57.1

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --run

  docker_build:
    name: Build Docker Image (no push)
    runs-on: ubuntu-latest
    needs: build_test
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository

    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read package version
        id: version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: APP_VERSION=${{ steps.version.outputs.APP_VERSION }}

  # Runs on a self-hosted runner on the lab host itself — GitHub's own hosted
  # runners can't reach this private host. Gated to push-to-main ONLY
  # (never pull_request) so untrusted PR code can never execute here; this
  # job only ever runs post-merge, already-trusted code. Delegates the
  # actual deploy to sentinel's own guarded engine (fetch + fast-
  # forward-only pull + docker compose build/up + health-check, refuses
  # rather than forces on a dirty/diverged checkout) rather than
  # reimplementing that logic here.
  deploy:
    name: Deploy to lab
    needs: [build_test, docker_build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, lab]
    steps:
      - name: Trigger sentinel deploy
        run: |
          curl -sf -X POST http://127.0.0.1:7891/api/deploy \
            -H 'Content-Type: application/json' \
            -d '{"repo":"jambo2","containerName":"jambo2-app-1"}' \
            -o deploy-result.json
          cat deploy-result.json
          jq -e '.deployStatus == "done"' deploy-result.json
